<!doctype html>
<html lang="en" data-theme="sunny">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Wonder Kids GK — Learn &amp; Quiz Fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* ================= THEMES ================= */
      :root, [data-theme="sunny"] {
        --bg: #FFF9F0;
        --bg2: #FFEFD2;
        --ink: #1B2A4A;
        --ink-soft: #45527A;
        --card: #FFFFFF;
        --card-soft: #FFF1D6;
        --line: #F0DCB8;
        --shadow: 0 14px 34px rgba(27, 42, 74, 0.16);
        --coral: #FF6B6B;
        --coral-deep: #D63A3A;
        --yellow: #FFC93C;
        --yellow-deep: #96690A;
        --teal: #2EC4B6;
        --teal-deep: #0B7A6E;
        --purple: #7B61FF;
        --purple-deep: #5A3ED6;
        --mint-deep: #1E8A3C;
        --wrong: #C62F2F;
        --wrong-bg: #FDE7E7;
        --right-bg: #DFF7E4;
        --star-off: #E7DCC4;
        --streak-bg: #FFE3AE;
        --streak-ink: #7A3E00;
        --bubble-border: rgba(255, 255, 255, 0.55);
      }
      [data-theme="ocean"] {
        --bg: #053058;
        --bg2: #0A4A75;
        --ink: #F2FAFF;
        --ink-soft: #BFE0F2;
        --card: #0B4A73;
        --card-soft: #0E5C8C;
        --line: #2E7BA8;
        --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        --coral-deep: #FF9D9D;
        --yellow-deep: #FFD75E;
        --teal-deep: #5FE3D3;
        --purple-deep: #C0AFFF;
        --mint-deep: #6FE89B;
        --wrong: #FF9DB0;
        --wrong-bg: #5E2340;
        --right-bg: #0B5340;
        --star-off: #2E7BA8;
        --streak-bg: #7A4A12;
        --streak-ink: #FFE1A8;
        --bubble-border: rgba(255, 255, 255, 0.35);
      }
      [data-theme="midnight"] {
        --bg: #0A0F24;
        --bg2: #131A3A;
        --ink: #F5F3FF;
        --ink-soft: #C6C1EE;
        --card: #171E42;
        --card-soft: #20295A;
        --line: #3A4276;
        --shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
        --coral-deep: #FF9DB0;
        --yellow-deep: #FFD93C;
        --teal-deep: #5FE3D3;
        --purple-deep: #C4B0FF;
        --mint-deep: #6FE89B;
        --wrong: #FF9DB0;
        --wrong-bg: #4A1E33;
        --right-bg: #123B2A;
        --star-off: #3A4276;
        --streak-bg: #6B4210;
        --streak-ink: #FFDF9E;
        --bubble-border: rgba(255, 255, 255, 0.3);
      }
      :root { --radius: 24px; }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Nunito", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
        overflow: hidden;
        height: 100dvh;
        -webkit-tap-highlight-color: transparent;
        display: flex; flex-direction: column;
        transition: background 0.4s ease, color 0.4s ease;
      }
      h1, h2, h3, .display { font-family: "Fredoka", "Nunito", sans-serif; }
      button { font-family: inherit; cursor: pointer; }
      button, [role="button"] { min-height: 2.75rem; }
      .hidden { display: none !important; }

      /* ---------- Calm background: slow bubbles + midnight stars ---------- */
      #bgFx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .bubble {
        position: absolute; border-radius: 50%;
        border: 2px solid var(--bubble-border);
        opacity: 0.13;
        animation: bubbleFloat ease-in-out infinite alternate;
        will-change: transform;
      }
      @keyframes bubbleFloat {
        from { transform: translateY(-14px); }
        to { transform: translateY(16px); }
      }
      body.bg-off .bubble { animation-play-state: paused; opacity: 0.06; }
      .stars {
        position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease;
        background-image:
          radial-gradient(2px 2px at 12% 22%, #FFF6C9 50%, transparent 51%),
          radial-gradient(1.6px 1.6px at 28% 68%, #FFFFFF 50%, transparent 51%),
          radial-gradient(2.2px 2.2px at 44% 14%, #FFD9EC 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 58% 42%, #FFFFFF 50%, transparent 51%),
          radial-gradient(2px 2px at 71% 80%, #FFF6C9 50%, transparent 51%),
          radial-gradient(1.7px 1.7px at 83% 30%, #FFFFFF 50%, transparent 51%),
          radial-gradient(2.1px 2.1px at 92% 58%, #CDEFFF 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 6% 84%, #FFFFFF 50%, transparent 51%),
          radial-gradient(1.8px 1.8px at 36% 88%, #FFD9EC 50%, transparent 51%),
          radial-gradient(1.6px 1.6px at 64% 8%, #FFFFFF 50%, transparent 51%);
      }
      [data-theme="midnight"] .stars { opacity: 0.9; animation: starTwinkle 5s ease-in-out infinite alternate; }
      body.bg-off .stars { animation-play-state: paused; }
      @keyframes starTwinkle { from { opacity: 0.45; } to { opacity: 0.95; } }

      /* ---------- Floating gear ---------- */
      .gear-btn {
        position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 12px; z-index: 40;
        width: 48px; height: 48px; min-height: 48px; border-radius: 50%;
        border: 3px solid var(--line); background: var(--card); color: var(--ink);
        font-size: 1.35rem; line-height: 1; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 14px rgba(27, 42, 74, 0.18);
      }
      .gear-btn:active { transform: scale(0.92) rotate(30deg); }
      .gear-btn { transition: transform 0.15s ease; }
      /* ---------- Screens ---------- */
      .screens {
        position: relative; z-index: 2; flex: 1; min-height: 0;
        width: 100%; max-width: 720px; margin: 0 auto;
        padding: calc(10px + env(safe-area-inset-top)) 14px 12px; box-sizing: border-box;
        display: flex;
      }
      .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; width: 100%; }

      .screen-head { display: flex; align-items: center; gap: 8px; padding-right: 58px; }
      #homeScreen { padding-top: 52px; }
      .head-title {
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: clamp(1rem, 3.6vmin, 1.3rem);
        background: var(--card); border: 3px solid var(--line); border-radius: 999px;
        padding: 6px 14px; flex: 1; text-align: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .count-pill, .score-pill {
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: clamp(0.82rem, 3vmin, 1rem);
        border-radius: 999px; padding: 7px 13px; white-space: nowrap;
      }
      .count-pill { background: var(--card); border: 3px solid var(--line); color: var(--ink); }
      .score-pill { background: #6C4CF1; color: #fff; box-shadow: 0 6px 14px rgba(108, 76, 241, 0.35); }
      .icon-btn {
        width: 46px; height: 46px; min-height: 46px; border-radius: 50%;
        border: 3px solid var(--line); background: var(--card); color: var(--ink);
        font-size: 1.25rem; line-height: 1;
        display: inline-flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 14px rgba(27, 42, 74, 0.14);
        flex: 0 0 auto; padding: 0;
      }
      .icon-btn:active { transform: scale(0.92); }

      /* ---------- Buttons ---------- */
      .btn {
        border: none; border-radius: 999px;
        font-family: "Fredoka", sans-serif; font-weight: 600;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
        text-decoration: none; color: #fff;
      }
      .btn:active { transform: scale(0.96); }
      .btn-coral {
        background: linear-gradient(180deg, #F0524D 0%, #D63A3A 100%);
        font-size: clamp(1.05rem, 3.8vmin, 1.3rem);
        padding: 12px 26px; min-height: 54px;
        box-shadow: 0 6px 0 #A82A2A, 0 12px 22px rgba(214, 58, 58, 0.32);
      }
      .btn-coral:active { box-shadow: 0 2px 0 #A82A2A; }
      .btn-mint {
        background: linear-gradient(180deg, #35B558 0%, #1E8A3C 100%);
        font-size: clamp(1.05rem, 3.8vmin, 1.3rem);
        padding: 12px 26px; min-height: 54px;
        box-shadow: 0 6px 0 #14652B, 0 12px 22px rgba(30, 138, 60, 0.3);
      }
      .btn-mint:active { box-shadow: 0 2px 0 #14652B; }
      .btn-ghost {
        background: var(--card); color: var(--ink);
        border: 3px solid var(--line);
        font-size: 0.95rem; padding: 8px 16px; min-height: 46px;
      }
      .btn-wide { width: 100%; }
      .btn-small {
        font-size: 0.95rem; padding: 8px 20px; min-height: 46px;
        box-shadow: 0 4px 0 #A82A2A, 0 8px 16px rgba(214, 58, 58, 0.3);
      }
      .btn-small:active { box-shadow: 0 2px 0 #A82A2A; }

      /* ---------- Home / topics ---------- */
      .home-title {
        margin: 2px 0 0; text-align: center;
        font-size: clamp(1.7rem, 7vmin, 2.6rem); font-weight: 700; line-height: 1.08;
      }
      .home-sub {
        margin: 0; text-align: center; font-weight: 800; color: var(--ink-soft);
        font-size: clamp(0.9rem, 3.2vmin, 1.05rem);
      }
      .home-media { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .home-video {
        width: 132px; height: 74px; object-fit: cover; display: block;
        border-radius: 16px; border: 3px solid var(--line); background: var(--card-soft);
        box-shadow: 0 6px 16px rgba(27, 42, 74, 0.16);
      }
      #homeLottie { width: 74px; height: 74px; flex: 0 0 auto; }
      .topic-grid {
        flex: 1; min-height: 0;
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      }
      @media (min-width: 640px) { .topic-grid { grid-template-columns: 1fr 1fr 1fr; } }
      .topic-card {
        border: 3px solid var(--line); background: var(--card);
        border-radius: var(--radius); box-shadow: var(--shadow);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; padding: 10px 8px; text-align: center; color: var(--ink);
        border-top: 10px solid var(--acc, var(--yellow));
        min-height: 0;
      }
      .topic-card:active { transform: scale(0.97); }
      .topic-card .t-emoji { font-size: clamp(2rem, 9vmin, 3.2rem); line-height: 1.1; }
      .topic-card .t-name { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: clamp(1rem, 4vmin, 1.35rem); line-height: 1.15; }

      /* ---------- Dots row + double-tap control bar ---------- */
      .dots-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 22px; flex-wrap: wrap; }
      .dots { display: flex; gap: 7px; align-items: center; justify-content: center; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
      .dot.on { background: var(--coral); transform: scale(1.25); }
      .dot.done { background: #2FBF71; }
      .dot.missed { background: var(--coral); }
      .card-count { font-size: 0.78rem; font-weight: 800; color: var(--ink-soft); opacity: 0.75; }
      .control-bar { display: none; flex-direction: column; gap: 8px; }
      body.controls-on .control-bar { display: flex; animation: barIn 0.25s ease; }
      @keyframes barIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .nav-row .btn { flex: 1; }
      .nav-btn {
        width: 52px; height: 52px; min-height: 52px; border-radius: 50%;
        border: 3px solid var(--line); background: var(--card);
        display: inline-flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 14px rgba(27, 42, 74, 0.14); flex: 0 0 auto; padding: 0;
        color: var(--ink);
      }
      .nav-btn:active { transform: scale(0.9); }
      .nav-btn.off { opacity: 0.35; }

      /* ---------- Learn flip cards ---------- */
      .stage {
        flex: 1; min-height: 0; width: 100%;
        display: flex; align-items: stretch; justify-content: center;
        perspective: 1200px; touch-action: pan-y;
        transform: rotateX(var(--trx, 0deg)) rotateY(var(--try, 0deg));
      }
      .swap { flex: 1; min-height: 0; display: flex; width: 100%; max-width: 560px; margin: 0 auto; transform-style: preserve-3d; will-change: transform; }
      .flipcard {
        position: relative; flex: 1; min-height: 0; width: 100%;
        transform-style: preserve-3d; cursor: pointer; outline: none;
      }
      .face {
        position: absolute; inset: 0;
        background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); color: var(--ink);
        display: flex; flex-direction: column; overflow: hidden;
        backface-visibility: hidden; -webkit-backface-visibility: hidden;
      }
      .face.back { transform: rotateY(180deg); align-items: center; justify-content: flex-start; text-align: center; padding: 16px 16px 0; gap: 7px; }
      .imgwrap { position: relative; width: 100%; height: 52%; flex: 0 0 auto; background: var(--card-soft); overflow: hidden; }
      .imgwrap .img-emoji {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 4.5rem;
      }
      .imgwrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      .imgwrap::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
        background: linear-gradient(180deg, rgba(27, 42, 74, 0) 0%, rgba(27, 42, 74, 0.26) 100%);
        pointer-events: none;
      }
      .front-q {
        flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: clamp(1.15rem, 4.6vmin, 1.6rem); line-height: 1.25;
        margin: 0; padding: 10px 16px 4px;
      }

      .back-emoji { font-size: clamp(2.4rem, 10vmin, 3.6rem); line-height: 1; }
      .back-a {
        margin: 0; font-size: clamp(1.45rem, 6.2vmin, 2.15rem); font-weight: 700; line-height: 1.1;
      }
      .back-fact {
        margin: 0; font-weight: 800; color: var(--ink);
        font-size: clamp(0.9rem, 3.5vmin, 1.08rem); line-height: 1.38; max-width: 44ch;
      }
      .back-fact.fact2 {
        background: var(--card-soft); border-radius: 14px; padding: 8px 12px;
      }
      .dyk-strip {
        margin: auto -16px 0; align-self: stretch;
        background: linear-gradient(180deg, #FFDE59 0%, #FFC93C 100%);
        border-top: 4px solid #D99A06;
        box-shadow: 0 -8px 18px rgba(150, 105, 10, 0.22);
        color: #1B2A4A; font-weight: 900; text-align: center;
        font-size: clamp(1rem, 4vmin, 1.22rem); line-height: 1.4;
        padding: 13px 16px 16px;
      }

      /* ---------- Quiz ---------- */
      .qpanel {
        flex: 1; min-height: 0; width: 100%;
        background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); color: var(--ink);
        display: flex; flex-direction: column; gap: 8px;
        padding: clamp(12px, 3vmin, 20px); box-sizing: border-box;
      }
      .q-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .streak-pill {
        font-family: "Fredoka", sans-serif; font-weight: 600;
        background: var(--streak-bg); color: var(--streak-ink);
        border-radius: 999px; padding: 7px 13px; white-space: nowrap;
        font-size: clamp(0.82rem, 3vmin, 1rem);
        animation: streakPop 0.35s ease;
      }
      @keyframes streakPop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
      .q-text {
        margin: 0; font-weight: 800; line-height: 1.3; color: var(--ink);
        font-size: clamp(1.15rem, 4.6vmin, 1.55rem);
      }
      .options { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; grid-auto-rows: 1fr; }
      .options.single { grid-template-columns: 1fr; }
      .opt {
        display: flex; align-items: center; gap: 10px;
        background: var(--card-soft); color: var(--ink);
        border: 3px solid var(--line); border-radius: 18px;
        font-size: clamp(0.95rem, 3.6vmin, 1.15rem); font-weight: 800; text-align: left;
        padding: 8px 12px; min-height: 0; width: 100%;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .opt .letter {
        flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--yellow); color: #1B2A4A;
        font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1rem;
      }
      .opt:nth-child(2) .letter { background: var(--teal); color: #06302A; }
      .opt:nth-child(3) .letter { background: var(--purple); color: #FFFFFF; }
      .opt:nth-child(4) .letter { background: var(--coral); color: #4A0E0E; }
      .opt:not(:disabled):hover { border-color: var(--yellow-deep); }
      .opt:disabled { cursor: default; opacity: 1; }
      .opt.correct { background: var(--right-bg); border-color: var(--mint-deep); }
      .opt.correct .letter { background: var(--mint-deep); color: #fff; }
      .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
      .opt.wrong .letter { background: var(--wrong); color: #fff; }
      .opt.dim { opacity: 0.5; }
      .opt.picked {
        border-color: var(--purple-deep);
        box-shadow: inset 0 0 0 2px var(--purple-deep), 0 4px 10px rgba(27, 42, 74, 0.14);
      }
      .opt.picked .letter { background: #6C4CF1; color: #fff; }
      .opt.missed { background: var(--right-bg); border: 3px dashed var(--mint-deep); }
      .opt.missed .letter { background: var(--mint-deep); color: #fff; }
      .check-row { display: flex; justify-content: center; }
      .feedback {
        min-height: 1.4em; margin: 0; text-align: center;
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: clamp(1rem, 4vmin, 1.25rem);
      }
      .feedback.good { color: var(--mint-deep); }
      .feedback.bad { color: var(--wrong); }

      /* ---------- Score ---------- */
      .score-screen { align-items: center; text-align: center; justify-content: center; gap: 4px; }
      #lottieBox { width: min(130px, 26vmin); height: min(130px, 26vmin); margin: 0 auto; }
      .rank { font-size: clamp(1.7rem, 7.5vmin, 2.6rem); font-weight: 700; margin: 0; line-height: 1.1; }
      .big-score { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(3rem, 15vmin, 4.6rem); line-height: 1; color: var(--purple-deep); }
      .big-score small { font-size: 0.4em; color: var(--ink-soft); }
      .result-stars { font-size: clamp(1.4rem, 6vmin, 2rem); letter-spacing: 4px; }
      .result-stars .on { color: #FFB800; text-shadow: 0 2px 0 rgba(150, 105, 10, 0.35); }
      .result-stars .off { color: var(--star-off); }
      .result-msg { font-weight: 800; color: var(--ink-soft); font-size: clamp(0.95rem, 3.6vmin, 1.08rem); margin: 2px 0 8px; line-height: 1.45; max-width: 46ch; }
      .score-btns { display: flex; flex-direction: column; gap: 10px; width: min(100%, 420px); }

      /* ---------- Settings sheet ---------- */
      .sheet-overlay {
        position: fixed; inset: 0; z-index: 60;
        background: rgba(27, 42, 74, 0.45);
        display: flex; align-items: flex-end; justify-content: center;
      }
      .sheet {
        background: var(--card); color: var(--ink);
        width: min(100%, 560px); max-height: 88dvh; overflow-y: auto;
        border-radius: 26px 26px 0 0; border-top: 3px solid var(--line);
        padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
        box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.3);
        animation: sheetUp 0.28s ease;
        box-sizing: border-box;
      }
      @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
      .sheet-head h2 { margin: 0; font-size: 1.35rem; font-weight: 700; }
      .set-row {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 0; border-bottom: 2px solid var(--line);
      }
      .set-block { padding: 10px 0; border-bottom: 2px solid var(--line); }
      .set-block:last-child { border-bottom: none; }
      .set-label { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.02rem; }
      .set-block .set-label { display: block; margin-bottom: 8px; }
      .switch {
        width: 58px; height: 34px; min-height: 34px; border-radius: 999px;
        background: var(--line); border: none; position: relative; flex: 0 0 auto; padding: 0;
        transition: background 0.18s ease;
      }
      .switch .knob {
        position: absolute; top: 3px; left: 3px; width: 28px; height: 28px;
        border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(27, 42, 74, 0.3);
        transition: left 0.18s ease;
      }
      .switch[aria-checked="true"] { background: var(--teal-deep); }
      .switch[aria-checked="true"] .knob { left: 27px; }
      .picker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .pick-btn {
        border: 3px solid var(--line); background: var(--card); color: var(--ink);
        border-radius: 999px; padding: 5px 13px; min-height: 42px;
        font-family: "Fredoka", sans-serif; font-weight: 600;
        font-size: 0.95rem;
        display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      }
      .pick-btn.sel { background: #6C4CF1; border-color: #6C4CF1; color: #fff; box-shadow: 0 5px 12px rgba(108, 76, 241, 0.35); }
      .pick-btn:active { transform: scale(0.93); }
      .theme-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .theme-btn {
        flex: 1 1 30%; border: 3px solid var(--line); background: var(--card); color: var(--ink);
        border-radius: 16px; padding: 8px 6px; min-height: 64px;
        font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 0.9rem;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
      }
      .theme-btn.sel { border-color: var(--purple-deep); box-shadow: 0 0 0 2px var(--purple-deep); }
      .theme-btn .swatch { width: 100%; height: 26px; border-radius: 9px; border: 2px solid rgba(27, 42, 74, 0.15); }
      .sw-sunny { background: linear-gradient(135deg, #FFF9F0 0%, #FFC93C 100%); }
      .sw-ocean { background: linear-gradient(135deg, #053058 0%, #2EC4B6 100%); }
      .sw-midnight { background: linear-gradient(135deg, #0A0F24 0%, #7B61FF 100%); }

      /* ---------- Toast ---------- */
      #toast {
        position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 70;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg);
        font-weight: 800; font-size: 0.92rem; text-align: center;
        padding: 10px 18px; border-radius: 999px; max-width: min(92vw, 440px);
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) {
        .btn, .opt, .pick-btn, .topic-card, .icon-btn, .nav-btn, .switch, .switch .knob { transition: none; }
        .bubble, .stars, .streak-pill, .sheet, .control-bar { animation: none; }
      }
    </style>

                if (typeof k !== "number" || Math.floor(k) !== k || k < 0 || k >= qn.options.length || seenIdx[k]) return null;
                seenIdx[k] = true;
              }
              if (qn.multi != null && typeof qn.multi !== "boolean") return null;
              if (qn.hint != null && typeof qn.hint !== "string") return null;
              var isMulti = qn.multi === true || qn.correct.length > 1;
              if (isMulti) {
                quiz.push({ q: qn.text, options: qn.options.slice(), multi: true, answers: qn.correct.map(function (ix) { return qn.options[ix]; }) });
              } else {
                quiz.push({ q: qn.text, options: qn.options.slice(), answer: qn.options[qn.correct[0]] });
              }
            }
            out.push({
              name: t.name,
              emoji: t.icon,
              acc: t.color,
              accDeep: fallbackTopic.accDeep,
              soft: fallbackTopic.soft,
              cards: cards,
              quiz: quiz
            });
          }
          return out;
        }

        function tone(freq, delay, dur, type, vol, slideTo) {
          if (muted) return;

          var t = ctx.currentTime + (delay || 0);
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = type || "sine";
          o.frequency.setValueAtTime(freq, t);
          if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + dur + 0.05);
        }
        function noiseBurst(delay, dur, freqFrom, freqTo, vol, type) {
          if (muted) return;
          var ctx = ac(); if (!ctx) return;
          var t = ctx.currentTime + (delay || 0);
          var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
          var buf = ctx.createBuffer(1, len, ctx.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          var src = ctx.createBufferSource(); src.buffer = buf;
          var f = ctx.createBiquadFilter(); f.type = type || "bandpass"; f.Q.value = 0.9;
          f.frequency.setValueAtTime(freqFrom, t);
          if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
          var g = ctx.createGain();
          g.gain.setValueAtTime(vol || 0.15, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f); f.connect(g); g.connect(ctx.destination);
          src.start(t); src.stop(t + dur + 0.05);
        }

        function sndWhoosh() { noiseBurst(0, 0.3, 350, 2200, 0.13); }
        function sndBoing() {

              .to(box, { rotationY: 90 * dir, duration: 0.16, ease: "power2.in", onComplete: function () { swapFn(); sndTransition(); } })
              .set(box, { rotationY: -90 * dir })
              .to(box, { rotationY: 0, duration: 0.36, ease: "back.out(1.5)" });

          } else {

        /* ================= LEARN ================= */
        function renderCard() {
          var topic = TOPICS[curTopic];
          var c = topic.cards[cardIdx];
          flipped = false;
          if (window.gsap) gsap.set(flipCard, { rotationY: 0 });
          else flipCard.style.transform = "";
          el("learnTitle").textContent = topic.emoji + " " + topic.name;
          el("learnCount").textContent = (cardIdx + 1) + " of " + topic.cards.length;
          setImg(el("frontImg"), c.img, c.web);
          el("frontImg").alt = c.alt;
          el("frontEmoji").textContent = c.emoji;
          el("frontQ").textContent = c.q;
          el("backEmoji").textContent = c.emoji;
          el("backA").textContent = c.a;
          el("backFact").textContent = c.fact;
          el("backFact").style.display = c.fact ? "" : "none";
          el("backFact3").textContent = c.fact3;
          el("backFact3").style.display = c.fact3 ? "" : "none";
          el("backFact2").textContent = c.fact2;
          el("backFact2").style.display = c.fact2 ? "" : "none";
          el("backFace").style.borderTop = "10px solid " + topic.acc;
          var dots = el("learnDots");
          dots.innerHTML = "";
          topic.cards.forEach(function (_, i) {
            var d = document.createElement("span");
            d.className = "dot" + (i === cardIdx ? " on" : "");
            dots.appendChild(d);
          });
          el("learnPrev").classList.toggle("off", cardIdx === 0);
          el("learnNext").classList.toggle("off", cardIdx === topic.cards.length - 1);
        }
        function openLearn(i) {
          curTopic = i;
          cardIdx = 0;
          showScreen(learnScreen);
          renderCard();
          if (window.gsap && !REDUCED) {
            gsap.fromTo(learnSwap, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" });
          }
        }
        function flipIt() {
          flipped = !flipped;
          sndFlip();
          if (window.gsap && !REDUCED) {
            gsap.to(flipCard, { rotationY: flipped ? 180 : 0, duration: 0.55, ease: "back.out(1.1)" });
          } else {
            flipCard.style.transform = flipped ? "rotateY(180deg)" : "";
          }
        }
        function goCard(n) {
          var len = TOPICS[curTopic].cards.length;
          if (n < 0 || n >= len || n === cardIdx) return;
          var dir = n > cardIdx ? 1 : -1;
          cardIdx = n;
          animateSwap(learnSwap, dir, renderCard);
        }
        el("learnPrev").addEventListener("click", function () { goCard(cardIdx - 1); });
        el("learnNext").addEventListener("click", function () { goCard(cardIdx + 1); });
        el("learnBack").addEventListener("click", function () { sndClick(); showScreen(homeScreen); });
        el("challengeBtn").addEventListener("click", function () { sndClick(); startQuiz(); });

        /* Single tap = flip, double-tap = buttons bar, swipe = move (learn card).
           A tap waits ~280ms: if a second tap lands in that window it is a
           double-tap (toggle the buttons bar) and the flip never happens. */
        var lp = null;
        var flipTimer = null;
        flipCard.addEventListener("pointerdown", function (e) { lp = { x: e.clientX, y: e.clientY }; });
        flipCard.addEventListener("pointerup", function (e) {
          if (!lp) return;
          var dx = e.clientX - lp.x, dy = e.clientY - lp.y;
          lp = null;
          if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
            if (flipTimer) { clearTimeout(flipTimer); flipTimer = null; }
            goCard(cardIdx + (dx < 0 ? 1 : -1));
          } else if (Math.abs(dx) < 14 && Math.abs(dy) < 14) {
            if (flipTimer) {
              clearTimeout(flipTimer);
              flipTimer = null;
              setControls(!document.body.classList.contains("controls-on"));
            } else {
              flipTimer = setTimeout(function () { flipTimer = null; flipIt(); }, 280);
            }
          }
        });
        flipCard.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flipIt(); }
        });

        /* ================= QUIZ ================= */
        function startQuiz() {
          var topic = TOPICS[curTopic];
          quizItems = shuffle(topic.quiz).map(function (item) {
            if (item.multi) return { q: item.q, multi: true, answers: item.answers.slice(), opts: shuffle(item.options) };
            return { q: item.q, answer: item.answer, opts: shuffle(item.options) };
          });
          answers = quizItems.map(function () { return null; });
          pendingSel = quizItems.map(function () { return []; });
          qIdx = 0;
          streak = 0;
          updateStreak();
          el("quizTitle").textContent = topic.emoji + " " + topic.name;
          updateScorePill();
          showScreen(quizScreen);
          renderQuestion(1, true);
        }
        function quizScore() {
          return answers.filter(function (a) { return a && a.correct; }).length;
        }
        function updateScorePill() { el("quizScore").textContent = quizScore(); }
        function updateStreak() {
          var pill = el("streakPill");
          if (streak >= 3) {
            el("streakNum").textContent = streak;
            pill.classList.remove("hidden");
            pill.style.animation = "none";
            void pill.offsetWidth;
            pill.style.animation = "";
          } else {
            pill.classList.add("hidden");
          }
        }
        function buildQuizDots() {
          var dots = el("quizDots");
          dots.innerHTML = "";
          quizItems.forEach(function (_, i) {
            var d = document.createElement("span");
            var cls = "dot";
            if (answers[i]) cls += answers[i].correct ? " done" : " missed";
            if (i === qIdx) cls += " on";
            d.className = cls;
            dots.appendChild(d);
          });
        }
        function renderQuestion(dir, instant) {
          var item = quizItems[qIdx];
          el("qCount").textContent = "Question " + (qIdx + 1) + " of " + quizItems.length;
          el("qText").textContent = item.q;
          var box = el("optionsBox");
          box.innerHTML = "";
          /* Adaptive layout: any lengthy option -> all options stack one per row */
          var longest = 0;
          item.opts.forEach(function (o) { if (o.length > longest) longest = o.length; });
          box.classList.toggle("single", longest > 14);
          var letters = ["A", "B", "C", "D"];
          var saved = answers[qIdx];
          item.opts.forEach(function (opt, idx) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "opt";
            b.innerHTML = '<span class="letter" aria-hidden="true">' + letters[idx] + '</span><span></span>';
            b.lastChild.textContent = opt;
            if (saved) {
              b.disabled = true;
              if (item.multi) {
                var wasPicked = saved.chosen.indexOf(opt) >= 0;
                var isRight = item.answers.indexOf(opt) >= 0;
                if (isRight && wasPicked) b.classList.add("correct");
                else if (isRight) b.classList.add("missed");
                else if (wasPicked) b.classList.add("wrong");
                else b.classList.add("dim");
              } else {
                if (opt === item.answer) b.classList.add("correct");
                else if (opt === saved.chosen) b.classList.add("wrong");
                else b.classList.add("dim");
              }
            } else if (item.multi) {
              var pre = pendingSel[qIdx].indexOf(opt) >= 0;
              b.classList.toggle("picked", pre);
              b.setAttribute("aria-pressed", pre ? "true" : "false");
              if (pre) b.firstChild.textContent = "✓";
              b.addEventListener("click", function () { toggleMulti(b, opt, idx); });
            } else {
              b.addEventListener("click", function () { onAnswer(b, opt, item); });
            }
            box.appendChild(b);
          });
          el("checkBtn").classList.toggle("hidden", !(item.multi && !saved));
          var fb = el("feedback");
          if (saved) {
            if (item.multi) {
              fb.textContent = saved.correct ? "Superb! That's correct! 🎉" : "Almost! The right answers are " + item.answers.join(" and ") + ".";
            } else {
              fb.textContent = saved.correct ? "Superb! That's correct! 🎉" : "Oops! The correct answer is " + item.answer + ".";
            }
            fb.className = "feedback " + (saved.correct ? "good" : "bad");
          } else {
            fb.textContent = "";
            fb.className = "feedback";
          }
          buildQuizDots();
          el("quizPrev").classList.toggle("off", qIdx === 0);
          var canNext = qIdx < quizItems.length - 1 && !!answers[qIdx];
          el("quizNext").classList.toggle("off", !canNext);
          var allDone = answers.every(function (a) { return a; });
          el("resultBtn").classList.toggle("hidden", !allDone);
          if (!instant && window.gsap && !REDUCED) {
            gsap.fromTo(box.children, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.05, ease: "power2.out" });
          }
        }
        function goQuestion(n) {
          if (n < 0 || n >= quizItems.length || n === qIdx) return;
          if (n > qIdx && !answers[qIdx]) return;
          var dir = n > qIdx ? 1 : -1;
          qIdx = n;
          animateSwap(quizSwap, dir, function () { renderQuestion(dir); });
        }
        function onAnswer(btn, chosen, item) {
          if (answers[qIdx]) return;
          sndClick();
          var correct = chosen === item.answer;
          answers[qIdx] = { chosen: chosen, correct: correct };
          streak = correct ? streak + 1 : 0;
          updateStreak();
          var buttons = el("optionsBox").querySelectorAll(".opt");
          buttons.forEach(function (b) {
            b.disabled = true;
            var label = b.lastChild.textContent;
            if (label === item.answer) b.classList.add("correct");
            else if (b !== btn) b.classList.add("dim");
          });
          var fb = el("feedback");
          if (correct) {
            setTimeout(sndCorrect, 90);
            fb.textContent = "Superb! That's correct! 🎉";
            fb.className = "feedback good";
            burstConfetti(false);
            if (window.gsap && !REDUCED) {
              gsap.fromTo(btn, { scale: 1 }, { scale: 1.06, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" });
            }
          } else {
            btn.classList.add("wrong");
            btn.classList.remove("dim");
            setTimeout(sndWrong, 90);
            fb.textContent = "Oops! The correct answer is " + item.answer + ".";
            fb.className = "feedback bad";
            if (window.gsap && !REDUCED) {
              gsap.fromTo(btn, { x: 0 }, { keyframes: [{ x: -7 }, { x: 7 }, { x: -4 }, { x: 4 }, { x: 0 }], duration: 0.38, ease: "power1.inOut" });
            }
          }
          finishAnswer();
        }
        function finishAnswer() {
          updateScorePill();
          buildQuizDots();
          el("quizNext").classList.toggle("off", !(qIdx < quizItems.length - 1 && !!answers[qIdx]));
          var allDone = answers.every(function (a) { return a; });
          el("resultBtn").classList.toggle("hidden", !allDone);
          if (allDone) {
            /* Challenge finished — celebrate and reveal the buttons bar so Result is one tap away */
            burstConfetti(false);
            setControls(true);
          }
        }
        function toggleMulti(b, opt, idx) {
          if (answers[qIdx]) return;
          sndClick();
          var sel = pendingSel[qIdx];
          var i = sel.indexOf(opt);
          if (i >= 0) {
            sel.splice(i, 1);
            b.classList.remove("picked");
            b.setAttribute("aria-pressed", "false");
            b.firstChild.textContent = ["A", "B", "C", "D"][idx];
          } else {
            sel.push(opt);
            b.classList.add("picked");
            b.setAttribute("aria-pressed", "true");
            b.firstChild.textContent = "✓";
          }
        }
        function onCheck(item) {
          if (answers[qIdx]) return;
          var sel = pendingSel[qIdx].slice();
          var fb = el("feedback");
          if (!sel.length) {
            fb.textContent = "Pick your answers first! 🙂";
            fb.className = "feedback";
            return;
          }
          sndClick();
          var exact = sel.length === item.answers.length && item.answers.every(function (a) { return sel.indexOf(a) >= 0; });
          answers[qIdx] = { chosen: sel, correct: exact };
          streak = exact ? streak + 1 : 0;
          updateStreak();
          el("checkBtn").classList.add("hidden");
          var buttons = el("optionsBox").querySelectorAll(".opt");
          buttons.forEach(function (b, idx) {
            b.disabled = true;
            b.classList.remove("picked");
            b.firstChild.textContent = ["A", "B", "C", "D"][idx];
            var label = b.lastChild.textContent;
            var isRight = item.answers.indexOf(label) >= 0;
            var wasPicked = sel.indexOf(label) >= 0;
            if (isRight && wasPicked) b.classList.add("correct");
            else if (isRight) b.classList.add("missed");
            else if (wasPicked) {
              b.classList.add("wrong");
              if (window.gsap && !REDUCED) {
                gsap.fromTo(b, { x: 0 }, { keyframes: [{ x: -7 }, { x: 7 }, { x: -4 }, { x: 4 }, { x: 0 }], duration: 0.38, ease: "power1.inOut" });
              }
            } else b.classList.add("dim");
          });
          if (exact) {
            setTimeout(sndCorrect, 90);
            fb.textContent = "Superb! That's correct! 🎉";
            fb.className = "feedback good";
            burstConfetti(false);
          } else {
            setTimeout(sndWrong, 90);
            fb.textContent = "Almost! The right answers are " + item.answers.join(" and ") + ".";
            fb.className = "feedback bad";
          }
          finishAnswer();
        }
        el("checkBtn").addEventListener("click", function () {
          var item = quizItems[qIdx];
          if (item && item.multi) onCheck(item);
        });
        el("quizPrev").addEventListener("click", function () { goQuestion(qIdx - 1); });
        el("quizNext").addEventListener("click", function () { goQuestion(qIdx + 1); });
        el("quizBack").addEventListener("click", function () { sndClick(); showScreen(learnScreen); renderCard(); });
        el("resultBtn").addEventListener("click", function () { sndClick(); showResults(); });

        /* Swipe on quiz stage */
        var qp = null;
        el("quizStage").addEventListener("pointerdown", function (e) { qp = { x: e.clientX, y: e.clientY }; });
        el("quizStage").addEventListener("pointerup", function (e) {
          if (!qp) return;
          var dx = e.clientX - qp.x, dy = e.clientY - qp.y;
          qp = null;
          if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
            goQuestion(qIdx + (dx < 0 ? 1 : -1));
          }
        });
        /* Swipe on learn stage background */
        var sp = null;
        el("learnStage").addEventListener("pointerdown", function (e) { sp = { x: e.clientX, y: e.clientY }; });
        el("learnStage").addEventListener("pointerup", function (e) {
          if (!sp) return;
          var dx = e.clientX - sp.x, dy = e.clientY - sp.y;
          sp = null;
          if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3 && e.target === el("learnStage")) {
            goCard(cardIdx + (dx < 0 ? 1 : -1));
          }
        });

        /* Arrow keys */
        document.addEventListener("keydown", function (e) {
          if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
          if (!settingsOverlay.classList.contains("hidden")) return;
          var d = e.key === "ArrowRight" ? 1 : -1;
          if (!learnScreen.classList.contains("hidden")) goCard(cardIdx + d);
          else if (!quizScreen.classList.contains("hidden")) goQuestion(qIdx + d);
        });

        /* ================= SCORE ================= */
        function rankFor(s, total) {
          var frac = total > 0 ? s / total : 0;
          if (s === total) return { title: "GK Superstar! 🏆", msg: "Wow, a perfect score! You are a true champion of this topic. Keep shining!" };
          if (frac >= 0.8) return { title: "Super Explorer! 🌟", msg: "Fantastic work! Just one more star to become a superstar. Try once more!" };
          if (frac >= 0.6) return { title: "Rising Star! ⭐", msg: "Good job, young explorer! You are learning fast. Play again and climb higher!" };
          if (frac >= 0.4) return { title: "Good Try! 🌱", msg: "You are getting there! Flip the learning cards once more, then try again." };
          return { title: "Keep Exploring! 🔍", msg: "Every expert was once a beginner. Learn the cards again and come back stronger!" };
        }
        function showResults() {
          var s = quizScore();
          var topic = TOPICS[curTopic];
          showScreen(scoreScreen);
          var r = rankFor(s, quizItems.length);
          el("finalTotal").textContent = " / " + quizItems.length;
          el("rankTitle").textContent = r.title;
          el("resultMsg").textContent = r.msg + " (" + topic.emoji + " " + topic.name + ")";
          var starsHtml = "";
          for (var i = 0; i < quizItems.length; i++) {
            starsHtml += '<span class="' + (i < s ? "on" : "off") + '">★</span>';
          }
          el("resultStars").innerHTML = starsHtml;
          var obj = { v: 0 };
          if (window.gsap && !REDUCED) {
            gsap.to(obj, { v: s, duration: 0.9, ease: "power2.out", onUpdate: function () { el("finalScore").textContent = Math.round(obj.v); } });
            gsap.fromTo(scoreScreen, { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" });
          } else { el("finalScore").textContent = s; }
          var lottieOk = false;
          try {
            if (window.lottie) {
              if (lottieAnim) { lottieAnim.destroy(); lottieAnim = null; }
              el("lottieBox").innerHTML = "";
              lottieAnim = lottie.loadAnimation({
                container: el("lottieBox"), renderer: "svg", loop: true, autoplay: true,
                path: "https://assets9.lottiefiles.com/packages/lf20_touohxv0.json"
              });
              lottieAnim.addEventListener("data_ready", function () { lottieOk = true; });
              lottieAnim.addEventListener("data_failed", function () { el("lottieBox").innerHTML = '<div style="font-size:4.2rem;line-height:1.4;" aria-hidden="true">🎉</div>'; });
            }
          } catch (e) { /* confetti below still celebrates */ }
          setTimeout(function () { if (!lottieOk && !lottieAnim) el("lottieBox").innerHTML = '<div style="font-size:4.2rem;line-height:1.4;" aria-hidden="true">🎉</div>'; }, 900);
          sndApplause();
          burstConfetti(true);
          setTimeout(function () { burstConfetti(true); }, 650);
        }
        el("againBtn").addEventListener("click", function () { sndClick(); startQuiz(); });
        el("topicsBtn").addEventListener("click", function () { sndClick(); showScreen(homeScreen); });

        /* ================= TILT (mobile default ON + mouse parallax) ================= */
        var isMobile = window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window || navigator.maxTouchPoints > 0;
        var needsIosPermission = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
        var tiltEnabled = isMobile;
        var sensorOn = false;
        var iosAsked = false;
        var tiltTarget = { x: 0, y: 0 };
        var tiltCurrent = { x: 0, y: 0 };
        setSwitch(el("setTilt"), tiltEnabled);

        window.addEventListener("mousemove", function (e) {
          tiltTarget.x = (e.clientX / window.innerWidth - 0.5) * 2;
          tiltTarget.y = (e.clientY / window.innerHeight - 0.5) * 2;
        }, { passive: true });

        function onOrientation(e) {
          if (e.gamma === null || e.beta === null) return;
          if (!tiltEnabled) return;
          tiltTarget.x = Math.max(-1, Math.min(1, e.gamma / 28));
          tiltTarget.y = Math.max(-1, Math.min(1, (e.beta - 42) / 28));
        }
        function attachSensor() {
          if (sensorOn) return;
          window.addEventListener("deviceorientation", onOrientation, { passive: true });
          sensorOn = true;
        }
        function requestIosPermission(fromTap) {
          if (iosAsked) return;
          iosAsked = true;
          DeviceOrientationEvent.requestPermission().then(function (res) {
            if (res === "granted") {
              attachSensor();
              showToast("Tilt magic is ON! Tilt your phone and watch the cards move 📱✨");
            } else {
              showToast("No problem — taps and swipes work great too! 😊");
            }
          }).catch(function () {
            showToast("Motion is not available here — taps work great! 😊");
          });
        }
        if (isMobile && tiltEnabled && !needsIosPermission && typeof DeviceOrientationEvent !== "undefined") {
          attachSensor();
        }
        /* iOS: ask automatically on the first tap of the home screen */
        document.addEventListener("pointerdown", function () {
          if (needsIosPermission && tiltEnabled && !iosAsked && !homeScreen.classList.contains("hidden")) {
            requestIosPermission(true);
          }
        }, { passive: true });

        el("setTilt").addEventListener("click", function () {
          tiltEnabled = !tiltEnabled;
          setSwitch(this, tiltEnabled);
          if (tiltEnabled) {
            if (needsIosPermission) { iosAsked = false; requestIosPermission(true); }
            else if (typeof DeviceOrientationEvent !== "undefined") {
              attachSensor();
              showToast(isMobile ? "Tilt magic is ON! 📱✨" : "Tilt is on — on a computer, move your mouse! 🖱️");
            } else {
              showToast("No motion sensor here — try moving your mouse! 🖱️");
            }
          } else {
            tiltTarget.x = 0; tiltTarget.y = 0;
          }
          sndClick();
        });

        (function tiltLoop() {
          tiltCurrent.x += (tiltTarget.x - tiltCurrent.x) * 0.06;
          tiltCurrent.y += (tiltTarget.y - tiltCurrent.y) * 0.06;
          if (!REDUCED) {
            var root = document.documentElement.style;
            root.setProperty("--try", (tiltCurrent.x * 3.2).toFixed(2) + "deg");
            root.setProperty("--trx", (-tiltCurrent.y * 3.2).toFixed(2) + "deg");
          }
          requestAnimationFrame(tiltLoop);
        })();
      })();
    </script>
  </body>
